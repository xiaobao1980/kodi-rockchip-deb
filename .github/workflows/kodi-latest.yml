name: kodi-latest

on:
  schedule:
    # Every tuesday at 01:30 UTC
    - cron: '30 1 * * 2'
  workflow_dispatch: # https://github.com/armsurvivors/kodi-rockchip-deb/actions/workflows/kodi-vendor-rkmpp-latest.yml
  #push:
  #  branches: [ main ]

env:
  KODI_BRANCH: Piers # Kodi 22.x release branch

permissions:
  packages: write
  contents: write

jobs:

  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release ID
        id: prep
        run: |
          echo ::set-output name=created::$(date -u +'%Y%m%d-%H%M')
    outputs:
      created: ${{ steps.prep.outputs.created }} # refer to as ${{needs.prepare.outputs.created}}

  build:
    needs: [ prepare ]
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false # let other jobs try to complete if one fails
      matrix:
        arch: [ { name: 'arm64', runner: "ubuntu-24.04-arm" } ]
        distro:
          #- { id: 'bookworm', image: 'debian:bookworm' }
          - { id: 'trixie', image: 'debian:trixie' }
          - { id: 'forky', image: 'debian:forky' }
          - { id: 'resolute', image: 'ubuntu:resolute' }
          # openEuler: glibc 2.38 baseline, and the only one of these that yields a native .rpm (plus a cross-distro .deb).
          - { id: 'openeuler-24.03', image: 'openeuler/openeuler:24.03' }
        ffmpeg:
          - { branch: '8.1', id: '81rkmpp', flavor: 'rkmpp', extraTag: 'rkmpp' }
          - { branch: 'n9.0.2', id: '902v4l2requests', flavor: 'v4l2requests', extraTag: 'v4l2requests' }
        dav1d:
          - { branch: '1.5.4', id: '154' }
        exclude:
          # openEuler 24.03 的 kernel-headers 是 6.6，早于 HEVC 无状态 EXT uAPI
          # （V4L2_CID_STATELESS_HEVC_EXT_SPS_ST_RPS / _LT_RPS），ffmpeg 的
          # 0017-hevc-Add-support-for-sps_st_rps-control.patch 编译期就要它们，打不过。
          # openEuler 面向 rk35xx vendor 内核，只出 rkmpp 风味；mainline 硬解走 Debian/Ubuntu 线。
          # 两个对象都写全（deep-equal 匹配），不依赖 exclude 的部分键匹配语义。
          - distro: { id: 'openeuler-24.03', image: 'openeuler/openeuler:24.03' }
            ffmpeg: { branch: 'n9.0.2', id: '902v4l2requests', flavor: 'v4l2requests', extraTag: 'v4l2requests' }
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare out dir ${{ matrix.arch.name }} ${{ matrix.distro.id }}
        run: mkdir -p out

      - name: Build ${{ matrix.arch.name }} ${{ matrix.distro.id }}
        uses: docker/build-push-action@v7
        timeout-minutes: 180
        with:
          context: .
          file: ./Dockerfile.kodi
          platforms: linux/${{ matrix.arch.name }}
          load: false
          pull: true # bring in updated versions of preexisting GH images
          push: false
          tags: kodi-rockchip-gbm:${{ matrix.arch.name }}-${{ matrix.ffmpeg.extraTag }}
          build-args: |
            PACKAGE_VERSION=${{needs.prepare.outputs.created}}
            BASE_IMAGE=${{ matrix.distro.image }}
            OS_ARCH=${{ matrix.arch.name }}
            FLAVOR=${{ matrix.ffmpeg.flavor }}
            KODI_BRANCH=${{ env.KODI_BRANCH }}
            FFMPEG_BRANCH=${{ matrix.ffmpeg.branch }}
            FFMPEG_ID=${{ matrix.ffmpeg.id }}
            DAV1D_BRANCH=${{ matrix.dav1d.branch }}
            DAV1D_ID=${{ matrix.dav1d.id }}
          outputs: |
            type=local,dest=out

      - name: Upload deb as artifact ${{ matrix.arch.name }} ${{ matrix.distro.id }}
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro.id }}-ffmpeg-${{ matrix.ffmpeg.id }}
          path: out/*.deb

      # Only the openEuler leg builds RPMs; the glob would simply match nothing elsewhere.
      - name: Upload rpm as artifact ${{ matrix.arch.name }} ${{ matrix.distro.id }}
        if: matrix.distro.id == 'openeuler-24.03'
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.distro.id }}-ffmpeg-${{ matrix.ffmpeg.id }}
          path: out/*.rpm

      # Login to ghcr.io to push the container image
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch.name }} ${{ matrix.distro.id }} (container image)
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          target: containerized-kodi # floating stage in the Dockerfile
          context: .
          file: ./Dockerfile.kodi
          platforms: linux/${{ matrix.arch.name }}
          load: false
          pull: false
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.distro.id }}-${{ matrix.ffmpeg.extraTag }}-latest,ghcr.io/${{ github.repository }}:${{ matrix.distro.id }}-${{ matrix.ffmpeg.extraTag }}-${{needs.prepare.outputs.created}}
          build-args: |
            PACKAGE_VERSION=${{needs.prepare.outputs.created}}
            BASE_IMAGE=${{ matrix.distro.image }}
            OS_ARCH=${{ matrix.arch.name }}
            FLAVOR=${{ matrix.ffmpeg.flavor }}
            KODI_BRANCH=${{ env.KODI_BRANCH }}
            FFMPEG_BRANCH=${{ matrix.ffmpeg.branch }}
            FFMPEG_ID=${{ matrix.ffmpeg.id }}
            DAV1D_BRANCH=${{ matrix.dav1d.branch }}
            DAV1D_ID=${{ matrix.dav1d.id }}

  release:
    needs: [ prepare, build ] # depend on the previous jobs...
    runs-on: ubuntu-latest
    if: '!cancelled()' # run even if some of the previous jobs failed, but not if the workflow was cancelled
    steps:
      # Download the built artifacts from GH artifacts.
      - uses: actions/download-artifact@v8
        name: Download deb artifacts
        with:
          path: out
          pattern: deb-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        name: Download rpm artifacts
        continue-on-error: true # only the openEuler leg produces these; missing means that leg did not finish
        with:
          path: out
          pattern: rpm-*
          merge-multiple: true

      - name: List artifacts downloaded
        run: |
          ls -lahtR

      # Release the artifacts into GitHub Releases
      - name: "GH specific release"
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{needs.prepare.outputs.created}}"
          prerelease: false
          title: "${{needs.prepare.outputs.created}}"
          files: |
            out/*.deb
            out/*.rpm
