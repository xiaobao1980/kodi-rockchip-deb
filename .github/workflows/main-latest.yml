name: main-latest

# xiaobao: 2026-07 修复说明
#  1) set-output 已被 GitHub 禁用（会直接失败），改为 $GITHUB_OUTPUT
#  2) matrix 构建 trixie + noble + jammy 三个底座（forky/bookworm 需要时取消注释）
#     jammy 标记 experimental：允许失败，不阻塞 trixie/noble 的 deb 发布
#  3) ghcr 容器镜像推送改为 continue-on-error，失败不阻塞 deb 发布
#  4) release 换用维护中的 softprops/action-gh-release（原 action 基于 node12 已被淘汰）
#  5) 2026-08-11：最新 kodi master 编译中断（上游最后验证通过 = 2026-07-21），
#     默认固定 KODI_COMMIT 到该已验证提交；Run workflow 时填 latest 可试最新 master

on:
  workflow_dispatch: # Actions 页面手动触发
    inputs:
      kodi_commit:
        description: 'Kodi 提交 SHA（默认 2026-07-21 上游已验证；填 latest 用最新 master）'
        required: true
        default: '70b11fc1ec8b493ef7580e54bacef76215afb1a1'
        type: string
  #push:
  #  branches: [ main ]

permissions:
  packages: write
  contents: write

jobs:

  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release ID
        id: prep
        run: echo "created=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"
    outputs:
      created: ${{ steps.prep.outputs.created }} # refer to as ${{needs.prepare.outputs.created}}

  build:
    needs: [ prepare ]
    runs-on: ${{ matrix.arch.runner }}
    # jammy 标记为 experimental：即使失败也不拖垮整个 workflow，trixie/noble 照常发布
    continue-on-error: ${{ matrix.distro.experimental == true }}
    strategy:
      fail-fast: false # let other jobs try to complete if one fails
      matrix:
        arch: [ { name: 'arm64', runner: "ubuntu-24.04-arm" } ]
        distro:
          #- { id: 'bookworm', image: 'debian:bookworm' }
          - { id: 'trixie', image: 'debian:trixie' }
          #- { id: 'noble',  image: 'ubuntu:noble' }
          #- { id: 'jammy',  image: 'ubuntu:jammy', experimental: true }
          - { id: 'forky', image: 'debian:forky' }
        ffmpeg:
          #- { branch: '7.1', id: '71' }
          #- { branch: '8.0', id: '80' }
          - { branch: '8.1', id: '81' }
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare out dir ${{ matrix.arch.name }} ${{ matrix.distro.id }}
        run: mkdir -p out

      - name: Build ${{ matrix.arch.name }} ${{ matrix.distro.id }}
        uses: docker/build-push-action@v7
        timeout-minutes: 300
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch.name }}
          load: false
          pull: true # bring in updated versions of preexisting GH images
          push: false
          tags: kodi-rockchip-gbm:${{ matrix.arch.name }}
          cache-from: type=gha,scope=${{ matrix.arch.name }}_${{ matrix.distro.id }}
          cache-to: type=gha,scope=${{ matrix.arch.name }}_${{ matrix.distro.id }},mode=max # mode=max "export all the layers of all intermediate steps"
          build-args: |
            PACKAGE_VERSION=${{needs.prepare.outputs.created}}
            BASE_IMAGE=${{ matrix.distro.image }}
            OS_ARCH=${{ matrix.arch.name }}
            FFMPEG_BRANCH=${{ matrix.ffmpeg.branch }}
            FFMPEG_ID=${{ matrix.ffmpeg.id }}
            KODI_COMMIT=${{ github.event.inputs.kodi_commit || '70b11fc1ec8b493ef7580e54bacef76215afb1a1' }}
          outputs: |
            type=local,dest=out

      - name: Upload deb as artifact ${{ matrix.arch.name }} ${{ matrix.distro.id }}
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro.id }}-ffmpeg-${{ matrix.ffmpeg.id }}
          path: out/*.deb

      # Login to ghcr.io to push the container image
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch.name }} ${{ matrix.distro.id }} (container image)
        uses: docker/build-push-action@v7
        continue-on-error: true # 容器镜像只是附赠品，失败不影响 deb
        timeout-minutes: 30
        with:
          target: containerized-kodi # floating stage in the Dockerfile
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch.name }}
          load: false
          pull: false
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.distro.id }}-latest,ghcr.io/${{ github.repository }}:${{ matrix.distro.id }}-${{needs.prepare.outputs.created}}
          build-args: |
            PACKAGE_VERSION=${{needs.prepare.outputs.created}}
            BASE_IMAGE=${{ matrix.distro.image }}
            OS_ARCH=${{ matrix.arch.name }}
            FFMPEG_BRANCH=${{ matrix.ffmpeg.branch }}
            FFMPEG_ID=${{ matrix.ffmpeg.id }}
            KODI_COMMIT=${{ github.event.inputs.kodi_commit || '70b11fc1ec8b493ef7580e54bacef76215afb1a1' }}

  release:
    needs: [ prepare, build ] # depend on the previous jobs...
    runs-on: ubuntu-latest
    steps:
      # Download the built artifacts from GH artifacts.
      - uses: actions/download-artifact@v8
        name: Download deb artifacts
        with:
          path: out
          pattern: deb-*
          merge-multiple: true

      - name: List artifacts downloaded
        run: |
          ls -lahtR

      # Release the artifacts into GitHub Releases
      - name: "GH Release with deb"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{needs.prepare.outputs.created}}"
          name: "kodi-rockchip-gbm ${{needs.prepare.outputs.created}} (ffmpeg 8.1 + pvr)"
          prerelease: false
          files: |
            out/*.deb
